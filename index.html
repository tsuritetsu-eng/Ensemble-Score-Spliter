<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF楽譜エディター & パート自動分割</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- pdf-lib -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .drag-over { border-color: #0284c7 !important; background-color: rgba(2, 132, 199, 0.05); }
        .ghost { opacity: 0.4; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col font-sans antialiased transition-colors duration-200">

    <!-- ヘッダー -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2 rounded-lg shadow">
                    <i class="fa-solid fa-music text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">PDF楽譜エディター</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">見開きA3分割 & パート自動認識</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="themeToggleBtn" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-sm">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline"></i>
                </button>
                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700"></div>
                <button id="exportAllBtn" disabled class="bg-brand-500 hover:bg-brand-600 disabled:bg-slate-300 dark:disabled:bg-slate-700 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-file-export"></i>
                    <span>書き出し</span>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col md:flex-row gap-6 overflow-hidden">
        
        <!-- 左側コントロールパネル -->
        <aside class="w-full md:w-80 flex-shrink-0 flex flex-col gap-4">
            
            <!-- ドロップエリア -->
            <div id="dropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl p-6 text-center bg-white dark:bg-slate-800 hover:border-brand-500 transition-all cursor-pointer shadow-sm relative group">
                <input type="file" id="fileInput" accept="application/pdf" multiple class="hidden">
                <div class="flex flex-col items-center gap-2 pointer-events-none">
                    <div class="w-12 h-12 rounded-full bg-brand-50 dark:bg-slate-700 flex items-center justify-center text-brand-500 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-file-circle-plus text-2xl"></i>
                    </div>
                    <p class="font-semibold text-sm">PDF楽譜を追加</p>
                    <p class="text-xs text-slate-400">ドラッグ＆ドロップ または タップ</p>
                </div>
            </div>

            <!-- 機能パネル -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 flex flex-col gap-3 shadow-sm">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">編集ツール</h2>
                
                <!-- A3見開き分割 -->
                <button id="splitSpreadBtn" disabled class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 disabled:opacity-50 text-slate-700 dark:text-slate-200 p-2.5 rounded-xl text-xs font-medium flex items-center justify-between transition">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-scissors text-brand-500"></i>
                        A3見開きを真ん中で分割
                    </span>
                    <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
                </button>

                <!-- パート自動認識 -->
                <button id="autoPartBtn" disabled class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 disabled:opacity-50 text-slate-700 dark:text-slate-200 p-2.5 rounded-xl text-xs font-medium flex items-center justify-between transition">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-purple-500"></i>
                        パート表記を自動認識
                    </span>
                    <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
                </button>

                <!-- 全選択/解除 -->
                <div class="flex gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
                    <button id="selectAllBtn" class="flex-1 text-xs py-1.5 bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 rounded-lg text-slate-600 dark:text-slate-300">全選択</button>
                    <button id="deselectAllBtn" class="flex-1 text-xs py-1.5 bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 rounded-lg text-slate-600 dark:text-slate-300">選択解除</button>
                </div>
            </div>

            <!-- ステータス表示 -->
            <div id="statusBox" class="hidden bg-brand-50 dark:bg-slate-800/80 border border-brand-100 dark:border-brand-900 rounded-2xl p-4 text-xs text-brand-700 dark:text-brand-300">
                <div class="flex items-center gap-2 font-semibold mb-1">
                    <i class="fa-solid fa-spinner fa-spin" id="statusSpinner"></i>
                    <span id="statusTitle">処理中...</span>
                </div>
                <p id="statusDesc" class="text-slate-500 dark:text-slate-400">PDFを解析しています。</p>
            </div>
        </aside>

        <!-- 右側メインエリア（サムネイル表示） -->
        <section class="flex-1 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-6 flex flex-col shadow-sm overflow-hidden">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-700">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-base">ページ一覧</h2>
                    <span id="pageCountBadge" class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs px-2 py-0.5 rounded-full font-medium">0 ページ</span>
                </div>
                <button id="clearAllBtn" class="text-xs text-rose-500 hover:text-rose-600 hidden">すべて消去</button>
            </div>

            <!-- 空の状態 -->
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-slate-400 p-8 text-center">
                <i class="fa-regular fa-file-pdf text-5xl mb-3 text-slate-300 dark:text-slate-600"></i>
                <p class="text-sm font-medium">PDFファイルを読み込むと<br>ここにページが表示されます</p>
            </div>

            <!-- ページサムネイルグリッド -->
            <div id="thumbnailGrid" class="flex-1 overflow-y-auto custom-scrollbar grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 p-1">
                <!-- JavaScriptで動的追加 -->
            </div>
        </section>
    </main>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-6 right-6 translate-y-20 opacity-0 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transition-all duration-300 z-50 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-info text-brand-500"></i>
        <span id="toastMessage">メッセージ</span>
    </div>

    <!-- JSロジック -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // アプリケーション状態
        let pagesData = []; // { id, pdfDoc, pageNum, originalPdfBytes, rotation, partName, selected }
        let isProcessing = false;

        // DOM要素
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const thumbnailGrid = document.getElementById('thumbnailGrid');
        const emptyState = document.getElementById('emptyState');
        const pageCountBadge = document.getElementById('pageCountBadge');
        const splitSpreadBtn = document.getElementById('splitSpreadBtn');
        const autoPartBtn = document.getElementById('autoPartBtn');
        const exportAllBtn = document.getElementById('exportAllBtn');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        // イベントリスナー設定
        themeToggleBtn.addEventListener('click', () => document.documentElement.classList.toggle('dark'));
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); });
        });
        ['dragenter', 'dragover'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over')));
        ['dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over')));
        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));

        // トースト通知
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            toastMessage.textContent = msg;
            
            toastIcon.className = type === 'error' ? 'fa-solid fa-triangle-exclamation text-rose-500' 
                                : type === 'success' ? 'fa-solid fa-circle-check text-emerald-500' 
                                : 'fa-solid fa-circle-info text-brand-500';

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // ファイル処理
        async function handleFiles(files) {
            if (!files || files.length === 0) return;
            const pdfFiles = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
            
            if (pdfFiles.length === 0) {
                showToast('PDFファイルを選択してください', 'error');
                return;
            }

            showStatus('PDFを読み込み中...', 'ファイルを取り込んでいます');

            for (const file of pdfFiles) {
                try {
                    let arrayBuffer;
                    try {
                        arrayBuffer = await file.arrayBuffer();
                    } catch (err) {
                        arrayBuffer = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = reject;
                            reader.readAsArrayBuffer(file);
                        });
                    }

                    const pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
                    
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        pagesData.push({
                            id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                            pdfDoc: pdfDoc,
                            pageNum: i,
                            originalPdfBytes: arrayBuffer,
                            rotation: 0,
                            partName: '',
                            selected: false
                        });
                    }
                } catch (err) {
                    console.error("PDF読み込みエラー:", err);
                    if (err.name === 'PasswordException') {
                        showToast('パスワード保護されたPDFは読み込めません', 'error');
                    } else {
                        showToast('PDFの読み込みに失敗しました', 'error');
                    }
                }
            }

            hideStatus();
            renderUI();
        }

        // UIレンダリング
        function renderUI() {
            thumbnailGrid.innerHTML = '';
            pageCountBadge.textContent = `${pagesData.length} ページ`;

            if (pagesData.length === 0) {
                emptyState.classList.remove('hidden');
                splitSpreadBtn.disabled = true;
                autoPartBtn.disabled = true;
                exportAllBtn.disabled = true;
                clearAllBtn.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            splitSpreadBtn.disabled = false;
            autoPartBtn.disabled = false;
            exportAllBtn.disabled = false;
            clearAllBtn.classList.remove('hidden');

            pagesData.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = `relative group bg-slate-50 dark:bg-slate-700/40 border-2 ${page.selected ? 'border-brand-500 bg-brand-50/20' : 'border-slate-200 dark:border-slate-600'} rounded-xl p-2 flex flex-col gap-2 transition-all`;
                card.draggable = true;

                // 並び替えドラッグ
                card.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', index);
                    card.classList.add('ghost');
                });
                card.addEventListener('dragend', () => card.classList.remove('ghost'));
                card.addEventListener('dragover', (e) => e.preventDefault());
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    if (fromIndex !== index) {
                        const movedItem = pagesData.splice(fromIndex, 1)[0];
                        pagesData.splice(index, 0, movedItem);
                        renderUI();
                    }
                });

                // キャンバスコンテナ
                const canvasBox = document.createElement('div');
                canvasBox.className = 'relative w-full aspect-[1/1.4] bg-white rounded-lg overflow-hidden flex items-center justify-center shadow-inner cursor-pointer';
                canvasBox.addEventListener('click', () => {
                    page.selected = !page.selected;
                    renderUI();
                });

                const canvas = document.createElement('canvas');
                canvas.className = 'max-w-full max-h-full object-contain';
                canvasBox.appendChild(canvas);
                
                // サムネイル非同期レンダリング
                renderThumbnail(page, canvas);

                // パートタグ
                if (page.partName) {
                    const tag = document.createElement('span');
                    tag.className = 'absolute top-2 left-2 bg-purple-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow';
                    tag.textContent = page.partName;
                    canvasBox.appendChild(tag);
                }

                // コントロールバー
                const controls = document.createElement('div');
                controls.className = 'flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 pt-1';
                controls.innerHTML = `
                    <span class="font-semibold text-slate-700 dark:text-slate-200">#${index + 1}</span>
                    <div class="flex gap-1">
                        <button onclick="movePage(${index}, -1)" class="p-1 hover:bg-slate-200 dark:hover:bg-slate-600 rounded"><i class="fa-solid fa-arrow-left"></i></button>
                        <button onclick="movePage(${index}, 1)" class="p-1 hover:bg-slate-200 dark:hover:bg-slate-600 rounded"><i class="fa-solid fa-arrow-right"></i></button>
                        <button onclick="rotatePage(${index})" class="p-1 hover:bg-slate-200 dark:hover:bg-slate-600 rounded text-brand-500"><i class="fa-solid fa-rotate-right"></i></button>
                        <button onclick="deletePage(${index})" class="p-1 hover:bg-slate-200 dark:hover:bg-slate-600 rounded text-rose-500"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;

                card.appendChild(canvasBox);
                card.appendChild(controls);
                thumbnailGrid.appendChild(card);
            });
        }

        // サムネイル安全描画
        async function renderThumbnail(page, canvas) {
            try {
                const pdfPage = await page.pdfDoc.getPage(page.pageNum);
                const viewport = pdfPage.getViewport({ scale: 0.3, rotation: page.rotation });
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await pdfPage.render({ canvasContext: ctx, viewport: viewport }).promise;
            } catch (err) {
                console.warn("サムネイル描画スキップ:", err);
            }
        }

        // ページ移動・回転・削除
        window.movePage = (index, dir) => {
            const target = index + dir;
            if (target >= 0 && target < pagesData.length) {
                const item = pagesData.splice(index, 1)[0];
                pagesData.splice(target, 0, item);
                renderUI();
            }
        };

        window.rotatePage = (index) => {
            pagesData[index].rotation = (pagesData[index].rotation + 90) % 360;
            renderUI();
        };

        window.deletePage = (index) => {
            pagesData.splice(index, 1);
            renderUI();
        };

        selectAllBtn.addEventListener('click', () => { pagesData.forEach(p => p.selected = true); renderUI(); });
        deselectAllBtn.addEventListener('click', () => { pagesData.forEach(p => p.selected = false); renderUI(); });
        clearAllBtn.addEventListener('click', () => { pagesData = []; renderUI(); });

        // A3見開き中央分割
        splitSpreadBtn.addEventListener('click', async () => {
            showStatus('A3分割処理中...', '横長ページを左右に分離しています');
            const newPages = [];
            
            for (const page of pagesData) {
                const pdfPage = await page.pdfDoc.getPage(page.pageNum);
                const viewport = pdfPage.getViewport({ scale: 1.0 });

                // 横長ページ判定（横幅 > 高さ）
                if (viewport.width > viewport.height) {
                    newPages.push({ ...page, id: page.id + '_L', cropSide: 'left' });
                    newPages.push({ ...page, id: page.id + '_R', cropSide: 'right' });
                } else {
                    newPages.push(page);
                }
            }

            pagesData = newPages;
            hideStatus();
            renderUI();
            showToast('見開きページの分割が完了しました', 'success');
        });

        // パート自動認識（テキスト解析 + OCR）
        autoPartBtn.addEventListener('click', async () => {
            showStatus('パート判定中...', '楽譜内のテキストをスキャンしています');
            const keywords = ['Flute', 'Oboe', 'Clarinet', 'Saxophone', 'Trumpet', 'Horn', 'Trombone', 'Euphonium', 'Tuba', 'Violin', 'Viola', 'Cello', 'Contrabass', 'Piano', 'Percussion', 'Score', '1st', '2nd'];

            for (let page of pagesData) {
                try {
                    const pdfPage = await page.pdfDoc.getPage(page.pageNum);
                    const textContent = await pdfPage.getTextContent();
                    const text = textContent.items.map(i => i.str).join(' ');

                    let detected = '';
                    for (const kw of keywords) {
                        if (text.toLowerCase().includes(kw.toLowerCase())) {
                            detected = kw;
                            break;
                        }
                    }
                    if (detected) page.partName = detected;
                } catch (e) {
                    console.warn("テキスト認識失敗:", e);
                }
            }

            hideStatus();
            renderUI();
            showToast('パートの自動識別が完了しました', 'success');
        });

        // PDF書き出し（ZIP対応）
        exportAllBtn.addEventListener('click', async () => {
            if (pagesData.length === 0) return;
            showStatus('PDF生成中...', 'ファイルをまとめています');

            try {
                const zip = new JSZip();
                const newPdf = await PDFLib.PDFDocument.create();

                for (const page of pagesData) {
                    const srcDoc = await PDFLib.PDFDocument.load(page.originalPdfBytes);
                    const [copiedPage] = await newPdf.copyPages(srcDoc, [page.pageNum - 1]);

                    // 回転適用
                    if (page.rotation) {
                        copiedPage.setRotation(PDFLib.degrees(page.rotation));
                    }

                    // A3分割時のクロップ処理
                    if (page.cropSide) {
                        const { width, height } = copiedPage.getSize();
                        if (page.cropSide === 'left') {
                            copiedPage.setCropBox(0, 0, width / 2, height);
                        } else if (page.cropSide === 'right') {
                            copiedPage.setCropBox(width / 2, 0, width / 2, height);
                        }
                    }

                    newPdf.addPage(copiedPage);
                }

                const pdfBytes = await newPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                saveAs(blob, '楽譜編集_まとめ.pdf');

                showToast('ダウンロードを開始しました', 'success');
            } catch (err) {
                console.error("出力エラー:", err);
                showToast('書き出しに失敗しました', 'error');
            } finally {
                hideStatus();
            }
        });

        function showStatus(title, desc) {
            document.getElementById('statusTitle').textContent = title;
            document.getElementById('statusDesc').textContent = desc;
            document.getElementById('statusBox').classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusBox').classList.add('hidden');
        }
    </script>
</body>
</html>
