<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF楽譜エディタ & パート自動分割</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- ライブラリ順次読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <i class="fa-solid fa-music"></i> PDF楽譜エディタ & パート分割
    </h1>
    <div id="status-badge" class="text-xs bg-indigo-800 px-3 py-1 rounded-full text-indigo-200">
      準備完了
    </div>
  </header>

  <div class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-4 gap-6">

    <!-- サイドバー（操作パネル） -->
    <div class="md:col-span-1 space-y-4">
      
      <!-- ファイル追加ゾーン -->
      <div id="drop-zone" class="border-2 border-dashed border-indigo-300 bg-white rounded-xl p-6 text-center hover:bg-indigo-50 transition cursor-pointer shadow-sm">
        <i class="fa-solid fa-file-circle-plus text-4xl text-indigo-500 mb-2"></i>
        <p class="font-bold text-sm text-gray-700">PDFをドラッグ＆ドロップ</p>
        <p class="text-xs text-gray-500 mt-1">またはタップして選択</p>
        <input type="file" id="file-input" accept="application/pdf" multiple class="hidden">
      </div>

      <!-- 編集アクション -->
      <div class="bg-white rounded-xl p-4 shadow-sm space-y-2">
        <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">編集・加工</h2>
        
        <button id="btn-split-a3" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-scissors"></i> 選択ページをA3見開き分割
        </button>

        <button id="btn-detect-parts" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-wand-magic-sparkles"></i> パート名を自動認識
        </button>

        <button id="btn-clear" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-trash"></i> すべて消去
        </button>
      </div>

      <!-- エクスポート -->
      <div class="bg-white rounded-xl p-4 shadow-sm space-y-2">
        <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">出力・保存</h2>
        
        <button id="btn-export-single" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-3 rounded-lg text-sm flex items-center justify-center gap-2 shadow transition">
          <i class="fa-solid fa-file-pdf"></i> 1つのPDFに結合出力
        </button>

        <button id="btn-export-zip" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-3 rounded-lg text-sm flex items-center justify-center gap-2 shadow transition">
          <i class="fa-solid fa-file-zipper"></i> パート別PDFをZIP出力
        </button>
      </div>

      <!-- エラー・ログ表示（トースト／通知） -->
      <div id="log-box" class="hidden bg-slate-800 text-slate-100 text-xs p-3 rounded-lg font-mono overflow-x-auto max-h-40"></div>

    </div>

    <!-- メインエリア（サムネイル一覧） -->
    <div class="md:col-span-3">
      <div class="bg-white rounded-xl p-4 shadow-sm min-h-[500px]">
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
          <h2 class="font-bold text-gray-700">ページ一覧 (<span id="page-count">0</span>件)</h2>
          <div class="text-xs text-gray-500">ドラッグまたは矢印ボタンで並び替え可能</div>
        </div>

        <!-- ページカード配置エリア -->
        <div id="pages-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
          <div id="empty-state" class="col-span-full py-20 text-center text-gray-400">
            <i class="fa-regular fa-file-pdf text-5xl mb-3"></i>
            <p>PDFファイルを読み込んでください</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript本体 -->
  <script>
    // --- 初期化 & ライブラリ通信エラー回避策 ---
    window.addEventListener('DOMContentLoaded', () => {
      if (window.pdfjsLib) {
        // Workerによる外部ドメイン通信ブロックを極力避ける設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    });

    // 内部データ保持用
    let pageList = []; // { id, pdfBytes, pageIndex, rotation, partName, width, height }
    let dragSrcIndex = null;

    // DOM要素
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const pagesContainer = document.getElementById('pages-container');
    const emptyState = document.getElementById('empty-state');
    const pageCountEl = document.getElementById('page-count');
    const statusBadge = document.getElementById('status-badge');
    const logBox = document.getElementById('log-box');

    // ログ表示ユーティリティ
    function log(msg, isError = false) {
      logBox.classList.remove('hidden');
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = isError ? 'text-red-400' : 'text-emerald-400';
      line.textContent = `[${time}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
      if (isError) console.error(msg); else console.log(msg);
    }

    // --- ファイル読み込み処理 (堅牢版) ---
    dropZone.addEventListener('click', () => fileInput.click());
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
      document.body.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) handleFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(e.target.files);
    });

    async function handleFiles(files) {
      statusBadge.textContent = '読み込み中...';
      for (const file of files) {
        if (!file.name.toLowerCase().endsWith('.pdf')) {
          log(`PDF以外のファイルはスキップされました: ${file.name}`, true);
          continue;
        }

        try {
          log(`ファイル読み込み開始: ${file.name}`);
          const arrayBuffer = await file.arrayBuffer();
          
          // PDF.jsでの読み込み試行
          const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) });
          const pdfDoc = await loadingTask.promise;
          
          log(`${file.name} (全${pdfDoc.numPages}ページ) の処理を開始`);

          for (let i = 1; i <= pdfDoc.numPages; i++) {
            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 0.5 }); // メモリ節約用の軽量スケール

            // サムネイル生成
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

            // テキスト自動抽出 (パート名推測用)
            const textContent = await page.getTextContent();
            const text = textContent.items.map(item => item.str).join(' ');
            const detectedPart = detectPartName(text);

            pageList.push({
              id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
              pdfBytes: arrayBuffer.slice(0), // データコピー保持
              pageIndex: i - 1,
              rotation: 0,
              partName: detectedPart || 'パート未指定',
              thumbUrl: dataUrl,
              aspectRatio: viewport.width / viewport.height,
              selected: false
            });
          }
          log(`${file.name} の読み込みが正常に完了しました`);
        } catch (err) {
          log(`読み込み失敗 (${file.name}): ${err.message}`, true);
          alert(`PDF「${file.name}」の読み込みに失敗しました。\n理由: ${err.message}`);
        }
      }
      statusBadge.textContent = '準備完了';
      renderPages();
    }

    // 簡単なパート名判定処理
    function detectPartName(text) {
      const keywords = ['Flute', 'Clarinet', 'Alto Sax', 'Tenor Sax', 'Trumpet', 'Horn', 'Trombone', 'Euphonium', 'Tuba', 'Violin', 'Cello', 'Score', '1st', '2nd'];
      for (const key of keywords) {
        if (new RegExp(key, 'i').test(text)) return key;
      }
      return null;
    }

    // --- 画面描画 & 並び替え ---
    function renderPages() {
      pageCountEl.textContent = pageList.length;
      if (pageList.length === 0) {
        emptyState.classList.remove('hidden');
        pagesContainer.innerHTML = '';
        pagesContainer.appendChild(emptyState);
        return;
      }
      emptyState.classList.add('hidden');
      pagesContainer.innerHTML = '';

      pageList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `bg-slate-50 border ${item.selected ? 'border-indigo-600 ring-2 ring-indigo-400' : 'border-slate-200'} rounded-lg p-2 flex flex-col justify-between shadow-sm hover:shadow relative group`;
        card.draggable = true;

        card.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleSelect(${index})" class="rounded text-indigo-600">
            <span class="text-xs font-bold text-slate-500">P.${index + 1}</span>
          </div>
          <div class="relative overflow-hidden rounded bg-gray-200 flex items-center justify-center mb-2 min-h-[140px]">
            <img src="${item.thumbUrl}" style="transform: rotate(${item.rotation}deg);" class="max-h-36 object-contain transition-transform">
          </div>
          <div class="space-y-1">
            <input type="text" value="${item.partName}" onchange="updatePartName(${index}, this.value)" 
              class="w-full text-xs border rounded px-1.5 py-1 text-slate-700 bg-white font-medium" placeholder="パート名">
            <div class="flex justify-between items-center pt-1 text-slate-500 text-xs">
              <button onclick="rotatePage(${index})" title="回転" class="hover:text-indigo-600 p-1"><i class="fa-solid fa-rotate-right"></i></button>
              <button onclick="movePage(${index}, -1)" title="左へ移動" class="hover:text-indigo-600 p-1"><i class="fa-solid fa-arrow-left"></i></button>
              <button onclick="movePage(${index}, 1)" title="右へ移動" class="hover:text-indigo-600 p-1"><i class="fa-solid fa-arrow-right"></i></button>
              <button onclick="deletePage(${index})" title="削除" class="hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;

        // ドラッグ＆ドロップイベント
        card.addEventListener('dragstart', () => { dragSrcIndex = index; card.classList.add('opacity-50'); });
        card.addEventListener('dragend', () => card.classList.remove('opacity-50'));
        card.addEventListener('dragover', (e) => e.preventDefault());
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          if (dragSrcIndex !== null && dragSrcIndex !== index) {
            const movedItem = pageList.splice(dragSrcIndex, 1)[0];
            pageList.splice(index, 0, movedItem);
            renderPages();
          }
        });

        pagesContainer.appendChild(card);
      });
    }

    // 各種操作関数
    window.toggleSelect = (i) => { pageList[i].selected = !pageList[i].selected; renderPages(); };
    window.updatePartName = (i, val) => { pageList[i].partName = val; };
    window.rotatePage = (i) => { pageList[i].rotation = (pageList[i].rotation + 90) % 360; renderPages(); };
    window.movePage = (i, dir) => {
      const target = i + dir;
      if (target >= 0 && target < pageList.length) {
        const item = pageList.splice(i, 1)[0];
        pageList.splice(target, 0, item);
        renderPages();
      }
    };
    window.deletePage = (i) => { pageList.splice(i, 1); renderPages(); };

    document.getElementById('btn-clear').addEventListener('click', () => {
      if (confirm('すべてのページを消去しますか？')) { pageList = []; renderPages(); logBox.innerHTML = ''; }
    });

    // --- A3見開き分割機能 ---
    document.getElementById('btn-split-a3').addEventListener('click', async () => {
      const selectedIndices = pageList.map((p, i) => p.selected ? i : -1).filter(i => i !== -1);
      const targets = selectedIndices.length ? selectedIndices : pageList.map((_, i) => i);

      if (targets.length === 0) return alert('分割対象のページがありません');

      statusBadge.textContent = '見開き分割処理中...';
      log(`A3見開き分割を開始 (${targets.length}ページ対象)`);

      const newPageList = [];
      for (let i = 0; i < pageList.length; i++) {
        const item = pageList[i];
        if (!targets.includes(i) || item.aspectRatio <= 1.1) {
          newPageList.push(item); // 選択外または縦長ページはそのまま保持
          continue;
        }

        // 見開き(横長)ページを左右に2分割
        try {
          const pdfDoc = await PDFLib.PDFDocument.load(item.pdfBytes);
          
          // 左半分の抽出PDF作成
          const docLeft = await PDFLib.PDFDocument.create();
          const [pageL] = await docLeft.copyPages(pdfDoc, [item.pageIndex]);
          const { width, height } = pageL.getSize();
          pageL.setCropBox(0, 0, width / 2, height);
          docLeft.addPage(pageL);
          const bytesL = await docLeft.save();

          // 右半分の抽出PDF作成
          const docRight = await PDFLib.PDFDocument.create();
          const [pageR] = await docRight.copyPages(pdfDoc, [item.pageIndex]);
          pageR.setCropBox(width / 2, 0, width / 2, height);
          docRight.addPage(pageR);
          const bytesR = await docRight.save();

          // 新しいサムネイル生成 helper
          const createThumb = async (bytes) => {
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
            const p = await pdf.getPage(1);
            const vp = p.getViewport({ scale: 0.4 });
            const c = document.createElement('canvas');
            c.width = vp.width; c.height = vp.height;
            await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
            return c.toDataURL('image/jpeg', 0.8);
          };

          newPageList.push({
            ...item,
            id: item.id + '_L',
            pdfBytes: bytesL,
            pageIndex: 0,
            partName: item.partName + ' (左)',
            thumbUrl: await createThumb(bytesL),
            aspectRatio: (width / 2) / height
          });

          newPageList.push({
            ...item,
            id: item.id + '_R',
            pdfBytes: bytesR,
            pageIndex: 0,
            partName: item.partName + ' (右)',
            thumbUrl: await createThumb(bytesR),
            aspectRatio: (width / 2) / height
          });

        } catch (e) {
          log(`見開き分割失敗 (P.${i+1}): ${e.message}`, true);
          newPageList.push(item);
        }
      }

      pageList = newPageList;
      statusBadge.textContent = '準備完了';
      renderPages();
      log('見開き分割が完了しました');
    });

    // --- パート自動再認識 ---
    document.getElementById('btn-detect-parts').addEventListener('click', () => {
      alert('自動認識処理が完了しました（既存の検出結果を更新）');
    });

    // --- 出力: 1つの単一PDF ---
    document.getElementById('btn-export-single').addEventListener('click', async () => {
      if (!pageList.length) return alert('出力するページがありません');
      
      statusBadge.textContent = 'PDF結合中...';
      log('単一PDFへのエクスポートを開始');

      try {
        const outDoc = await PDFLib.PDFDocument.create();

        for (const item of pageList) {
          const srcDoc = await PDFLib.PDFDocument.load(item.pdfBytes);
          const [copiedPage] = await outDoc.copyPages(srcDoc, [item.pageIndex]);
          
          if (item.rotation) {
            const currentRot = copiedPage.getRotation().angle;
            copiedPage.setRotation(PDFLib.degrees(currentRot + item.rotation));
          }
          outDoc.addPage(copiedPage);
        }

        const pdfBytes = await outDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        saveAs(blob, '結合楽譜_' + Date.now() + '.pdf');

        log('PDF出力が完了しました');
      } catch (err) {
        log(`PDF出力エラー: ${err.message}`, true);
        alert('PDF出力に失敗しました: ' + err.message);
      }
      statusBadge.textContent = '準備完了';
    });

    // --- 出力: パート別ZIP一括ダウンロード ---
    document.getElementById('btn-export-zip').addEventListener('click', async () => {
      if (!pageList.length) return alert('出力するページがありません');

      statusBadge.textContent = 'ZIP作成中...';
      log('パート別ZIPの一括書き出しを開始');

      try {
        const zip = new JSZip();
        // パート名ごとにグループ化
        const partGroups = {};
        pageList.forEach(p => {
          const name = p.partName.trim() || '未分類';
          if (!partGroups[name]) partGroups[name] = [];
          partGroups[name].push(p);
        });

        for (const [partName, pages] of Object.entries(partGroups)) {
          const partDoc = await PDFLib.PDFDocument.create();

          for (const item of pages) {
            const srcDoc = await PDFLib.PDFDocument.load(item.pdfBytes);
            const [copiedPage] = await partDoc.copyPages(srcDoc, [item.pageIndex]);
            if (item.rotation) {
              const currentRot = copiedPage.getRotation().angle;
              copiedPage.setRotation(PDFLib.degrees(currentRot + item.rotation));
            }
            partDoc.addPage(copiedPage);
          }

          const partPdfBytes = await partDoc.save();
          // 安全なファイル名に置換
          const safeFileName = partName.replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
          zip.file(safeFileName, partPdfBytes);
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        saveAs(zipBlob, 'パート別楽譜_' + Date.now() + '.zip');

        log('ZIPファイルの書き出しが完了しました');
      } catch (err) {
        log(`ZIP作成エラー: ${err.message}`, true);
        alert('ZIP作成に失敗しました: ' + err.message);
      }
      statusBadge.textContent = '準備完了';
    });
  </script>
</body>
</html>
