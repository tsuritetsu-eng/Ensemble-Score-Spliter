<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF楽譜エディター & パート自動分割</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js & pdf-lib & JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    .drag-over { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.1) !important; }
    .thumbnail-card { transition: transform 0.2s, box-shadow 0.2s; }
    .thumbnail-card.dragging { opacity: 0.4; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2 text-blue-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
        PDF楽譜エディター
      </h1>
      <div class="flex gap-2">
        <button id="splitA3Btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow">
          ✂️ A3見開き中央分割
        </button>
        <button id="autoDetectBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow">
          🔍 自動パート認識
        </button>
        <button id="exportZipBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow">
          📦 パート別ZIP書き出し
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-6">

    <!-- Notification Toast -->
    <div id="toast" class="hidden fixed bottom-6 right-6 z-50 bg-slate-800 border text-white px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 max-w-md"></div>

    <!-- Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-500 transition-all bg-slate-800/50">
      <input type="file" id="fileInput" multiple accept="application/pdf" class="hidden">
      <div class="flex flex-col items-center gap-2">
        <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <p class="text-lg font-medium text-slate-200">PDF楽譜ファイルをここにドラッグ＆ドロップ</p>
        <p class="text-sm text-slate-400">またはタップ・クリックしてファイルを選択（複数ファイル対応）</p>
      </div>
    </div>

    <!-- Page Grid Header -->
    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
      <h2 class="text-lg font-semibold text-slate-300">読み込み済みページ (<span id="pageCount">0</span>)</h2>
      <button id="clearAllBtn" class="text-xs text-rose-400 hover:text-rose-300 underline">すべてクリア</button>
    </div>

    <!-- Page Grid Container -->
    <div id="pageGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

  </main>

  <script>
    // PDF.js Worker Configuration
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pagesData = []; // { id, pdfDoc, pageIndex, rotation, partName, origPdfBytes }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const pageGrid = document.getElementById('pageGrid');
    const pageCountEl = document.getElementById('pageCount');

    // Toast Utility
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 border ${
        type === 'error' ? 'bg-rose-900 border-rose-500 text-rose-100' :
        type === 'success' ? 'bg-emerald-900 border-emerald-500 text-emerald-100' :
        'bg-slate-800 border-slate-600 text-slate-100'
      }`;
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    // Drag and Drop Events for Files
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      document.body.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
    });
    ['dragenter', 'dragover'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.add('drag-over')));
    ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.remove('drag-over')));

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFiles(e.target.files));
    dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

    async function handleFiles(files) {
      if (!files.length) return;
      showToast('PDFを読み込み中...', 'info');

      for (const file of files) {
        if (file.type !== 'application/pdf') continue;
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
          
          for (let i = 1; i <= pdfDoc.numPages; i++) {
            pagesData.push({
              id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
              pdfDoc: pdfDoc,
              origPdfBytes: arrayBuffer,
              pageIndex: i,
              rotation: 0,
              partName: '未割り当て'
            });
          }
        } catch (err) {
          console.error(err);
          showToast(`読み込み失敗: ${file.name} (破損または暗号化の可能性があります)`, 'error');
        }
      }
      renderPages();
    }

    // Render Page Thumbnails safely using Offscreen Rendering to avoid "Receiver is detached"
    async function renderPages() {
      pageGrid.innerHTML = '';
      pageCountEl.textContent = pagesData.length;

      pagesData.forEach((page, idx) => {
        const card = document.createElement('div');
        card.className = 'thumbnail-card bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col gap-2 relative group';
        card.draggable = true;

        // Card Content HTML
        card.innerHTML = `
          <div class="flex justify-between items-center text-xs text-slate-400">
            <span>P.${idx + 1}</span>
            <span class="bg-slate-700 px-1.5 py-0.5 rounded text-[10px] text-blue-300 font-mono">${page.partName}</span>
          </div>
          <div class="canvas-container bg-slate-900 rounded border border-slate-700/50 flex items-center justify-center min-h-[160px] overflow-hidden">
            <canvas class="w-full h-auto object-contain"></canvas>
          </div>
          <div class="flex justify-between items-center gap-1 mt-auto pt-1">
            <button onclick="movePage(${idx}, -1)" class="p-1 hover:bg-slate-700 rounded text-slate-300 text-xs">←</button>
            <button onclick="rotatePage(${idx})" class="p-1 hover:bg-slate-700 rounded text-slate-300 text-xs">🔄</button>
            <button onclick="deletePage(${idx})" class="p-1 hover:bg-rose-900/50 text-rose-400 rounded text-xs">🗑️</button>
            <button onclick="movePage(${idx}, 1)" class="p-1 hover:bg-slate-700 rounded text-slate-300 text-xs">→</button>
          </div>
        `;

        pageGrid.appendChild(card);

        // Safe Offscreen Canvas Rendering
        renderPageToCanvas(page, card.querySelector('canvas'));
      });
    }

    async function renderPageToCanvas(pageObj, targetCanvas) {
      try {
        const pdfPage = await pageObj.pdfDoc.getPage(pageObj.pageIndex);
        const viewport = pdfPage.getViewport({ scale: 0.4, rotation: pageObj.rotation });

        // Offscreen canvas processing
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');
        offCanvas.width = viewport.width;
        offCanvas.height = viewport.height;

        await pdfPage.render({ canvasContext: offCtx, viewport: viewport }).promise;

        if (targetCanvas && targetCanvas.isConnected) {
          targetCanvas.width = offCanvas.width;
          targetCanvas.height = offCanvas.height;
          const ctx = targetCanvas.getContext('2d');
          ctx.drawImage(offCanvas, 0, 0);
        }
      } catch (e) {
        console.warn('Canvas rendering skipped safely:', e);
      }
    }

    // Page Controls
    window.rotatePage = function(idx) {
      pagesData[idx].rotation = (pagesData[idx].rotation + 90) % 360;
      renderPages();
    };

    window.deletePage = function(idx) {
      pagesData.splice(idx, 1);
      renderPages();
    };

    window.movePage = function(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= pagesData.length) return;
      const temp = pagesData[idx];
      pagesData[idx] = pagesData[target];
      pagesData[target] = temp;
      renderPages();
    };

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      pagesData = [];
      renderPages();
    });

    // A3 Center Split Feature
    document.getElementById('splitA3Btn').addEventListener('click', async () => {
      if (!pagesData.length) return showToast('分割するページがありません', 'error');
      showToast('A3見開きページを処理中...', 'info');

      let newPages = [];
      for (const page of pagesData) {
        const pdfPage = await page.pdfDoc.getPage(page.pageIndex);
        const vp = pdfPage.getViewport({ scale: 1.0 });

        // Check if landscape (Width > Height = Spreading)
        if (vp.width > vp.height) {
          // Left page & Right page duplicated for PDF-lib CropBox extraction
          newPages.push({ ...page, partName: (page.partName !== '未割り当て' ? page.partName + ' (左)' : '未割り当て') });
          newPages.push({ ...page, partName: (page.partName !== '未割り当て' ? page.partName + ' (右)' : '未割り当て') });
        } else {
          newPages.push(page);
        }
      }
      pagesData = newPages;
      renderPages();
      showToast('見開き分割が完了しました', 'success');
    });

  </script>
</body>
</html>
